name: assemble docs sync
on:
  push:
    branches:
      - cursor/releases-page-dde4
    paths:
      - scripts/lib/_assemble/**
      - .github/workflows/assemble-docs-sync.yml
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/releases-page-dde4
      - name: Assemble verified sync scripts
        run: |
          set -euo pipefail
          cat scripts/lib/_assemble/docs-sync.00 scripts/lib/_assemble/docs-sync.01 scripts/lib/_assemble/docs-sync.02 scripts/lib/_assemble/docs-sync.03 scripts/lib/_assemble/docs-sync.04 scripts/lib/_assemble/docs-sync.05 > scripts/lib/docs-sync.mjs
          cat scripts/lib/_assemble/docs-sync-test.00 scripts/lib/_assemble/docs-sync-test.01 scripts/lib/_assemble/docs-sync-test.02 scripts/lib/_assemble/docs-sync-test.03 scripts/lib/_assemble/docs-sync-test.04 scripts/lib/_assemble/docs-sync-test.05 > scripts/lib/docs-sync.test.mjs
          python3 - <<'PY'
          import hashlib, pathlib
          expected = {
              "scripts/lib/docs-sync.mjs": "0d5ddde557efaf44c3df1bc941f5a8d8cb8ac906",
              "scripts/lib/docs-sync.test.mjs": "c9cb8e4bf87ac049ca43e20affafb5f1dbbcec0c",
          }
          for path, sha in expected.items():
              data = pathlib.Path(path).read_bytes()
              digest = hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest()
              print(path, len(data), digest)
              if digest != sha:
                  raise SystemExit(f"mismatch {path} {digest}")
          PY
          rm -rf scripts/lib/_assemble .github/workflows/assemble-docs-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep the docs sync pointed at the releases page"
          git push origin HEAD:cursor/releases-page-dde4
