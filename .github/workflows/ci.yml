name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm types:check
        env:
          SKIP_SYNC: '1'

  build:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          SKIP_SYNC: '1'

      - name: Verify static export output
        run: |
          test -f out/index.html
          test -f out/.nojekyll
          test -f out/og/site/image.png
          test -f out/og/blog/image.png
          python3 - <<'PY'
          import json
          from pathlib import Path

          html = Path('out/index.html').read_text()
          if 'opentide==' in html:
              raise SystemExit('Homepage must not pin a package version')

          snapshot = json.loads(Path('lib/generated/pypi-release.json').read_text())
          version = snapshot.get('version')
          if not isinstance(version, str) or not version:
              raise SystemExit('Build did not snapshot a PyPI version')
          needle = f'{version} on PyPI'
          if needle not in html:
              raise SystemExit(f'Homepage is missing {needle!r}')
          print(f'Homepage advertises {needle} (build snapshot; live visitors re-fetch PyPI)')
          PY
