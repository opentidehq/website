name: Update documentation submodules

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Parent repo only — private submodules use deploy keys below
          submodules: false
          fetch-depth: 0

      - name: Configure SSH for private documentation submodules
        env:
          BUNDLE: ${{ secrets.DOCS_SUBMODULES_SSH_KEYS }}
        run: |
          set -euo pipefail
          if [ -z "${BUNDLE}" ]; then
            echo "::error::Missing secret DOCS_SUBMODULES_SSH_KEYS (read-only deploy keys for opentide + specifications)."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          awk '/-----BEGIN OPENTIDE KEY-----/{f=1;next}/-----END OPENTIDE KEY-----/{f=0}f' \
            <<<"$BUNDLE" > ~/.ssh/opentide
          awk '/-----BEGIN SPECIFICATIONS KEY-----/{f=1;next}/-----END SPECIFICATIONS KEY-----/{f=0}f' \
            <<<"$BUNDLE" > ~/.ssh/specifications
          chmod 600 ~/.ssh/opentide ~/.ssh/specifications

          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null

          printf '%s\n' \
            'Host github.com-opentide' \
            '  HostName github.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/opentide' \
            '  IdentitiesOnly yes' \
            '' \
            'Host github.com-specifications' \
            '  HostName github.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/specifications' \
            '  IdentitiesOnly yes' \
            > ~/.ssh/config
          chmod 600 ~/.ssh/config

          # Local config only — keep committed .gitmodules on HTTPS for local clones
          git config submodule.vendor/opentide.url git@github.com-opentide:OpenTideHQ/opentide.git
          git config submodule.vendor/specifications.url git@github.com-specifications:OpenTideHQ/specifications.git

      - name: Update submodules to latest
        id: bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git config submodule.vendor/opentide.url git@github.com-opentide:OpenTideHQ/opentide.git
          git config submodule.vendor/specifications.url git@github.com-specifications:OpenTideHQ/specifications.git
          git submodule update --init --remote --merge vendor/opentide vendor/specifications

          if git diff --quiet -- vendor/opentide vendor/specifications; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Submodules already up to date."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git add vendor/opentide vendor/specifications
          git commit -m "chore: bump documentation submodules"
          git push -u origin "HEAD:refs/heads/chore/bump-docs-submodules" --force
          echo "Pushed branch chore/bump-docs-submodules"

      - name: Open or update pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh pr view chore/bump-docs-submodules --json url --jq .url 2>/dev/null; then
            echo "PR already exists for chore/bump-docs-submodules"
            exit 0
          fi

          if gh pr create \
            --base main \
            --head chore/bump-docs-submodules \
            --title "chore: bump documentation submodules" \
            --body "Automated weekly bump of opentide and specifications submodules.

          Run \`pnpm sync:content && pnpm build\` locally to verify before merging."; then
            exit 0
          fi

          echo "::warning::Could not open a PR (org may block Actions from creating PRs). Branch is ready: chore/bump-docs-submodules"
          echo "Open manually: https://github.com/OpenTideHQ/website/compare/main...chore/bump-docs-submodules?expand=1"
          exit 0
