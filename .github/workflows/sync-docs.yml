# Keep documentation on opentide.org in lockstep with upstream repos.
#
# A package release does NOT need this workflow for the landing version number —
# that is fetched live from PyPI in the browser. This pipeline exists so that
# when docs/changelog/specs change, the site updates and deploys with
# no human in the loop.
#
# Instant trigger from OpenTideHQ/opentide after a PyPI publish (optional):
#   gh api repos/OpenTideHQ/website/dispatches -f event_type=opentide-released
#   (needs a PAT or GitHub App token with repo scope on this repository)
name: Sync docs and deploy

on:
  schedule:
    # Hourly backup if a release/docs push did not dispatch us.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: Why this sync was requested
        required: false
        default: manual
  repository_dispatch:
    types: [opentide-released, docs-changed]

concurrency:
  group: sync-docs
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Configure SSH for private documentation submodules
        env:
          BUNDLE: ${{ secrets.DOCS_SUBMODULES_SSH_KEYS }}
        run: |
          set -euo pipefail
          if [ -z "${BUNDLE}" ]; then
            echo "::error::Missing secret DOCS_SUBMODULES_SSH_KEYS (read-only deploy keys for opentide + specifications)."
            exit 1
          fi

          # Keep deploy keys out of ~/.ssh so a symlink in a submodule cannot
          # copy them into public content/docs during pnpm sync:content.
          KEY_DIR="${RUNNER_TEMP}/docs-submodule-keys"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          echo "KEY_DIR=$KEY_DIR" >> "$GITHUB_ENV"

          awk '/-----BEGIN OPENTIDE KEY-----/{f=1;next}/-----END OPENTIDE KEY-----/{f=0}f' \
            <<<"$BUNDLE" > "$KEY_DIR/opentide"
          awk '/-----BEGIN SPECIFICATIONS KEY-----/{f=1;next}/-----END SPECIFICATIONS KEY-----/{f=0}f' \
            <<<"$BUNDLE" > "$KEY_DIR/specifications"
          chmod 600 "$KEY_DIR/opentide" "$KEY_DIR/specifications"

          ssh-keyscan -t ed25519,rsa github.com >> "$KEY_DIR/known_hosts" 2>/dev/null
          chmod 644 "$KEY_DIR/known_hosts"

          printf '%s\n' \
            'Host github.com-opentide' \
            '  HostName github.com' \
            '  User git' \
            "  IdentityFile ${KEY_DIR}/opentide" \
            '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking yes' \
            "  UserKnownHostsFile ${KEY_DIR}/known_hosts" \
            '' \
            'Host github.com-specifications' \
            '  HostName github.com' \
            '  User git' \
            "  IdentityFile ${KEY_DIR}/specifications" \
            '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking yes' \
            "  UserKnownHostsFile ${KEY_DIR}/known_hosts" \
            > "$KEY_DIR/config"
          chmod 600 "$KEY_DIR/config"

          echo "GIT_SSH_COMMAND=ssh -F ${KEY_DIR}/config -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

          git config submodule.vendor/opentide.url git@github.com-opentide:OpenTideHQ/opentide.git
          git config submodule.vendor/specifications.url git@github.com-specifications:OpenTideHQ/specifications.git

      - name: Update submodules to latest
        run: |
          set -euo pipefail
          git config submodule.vendor/opentide.url git@github.com-opentide:OpenTideHQ/opentide.git
          git config submodule.vendor/specifications.url git@github.com-specifications:OpenTideHQ/specifications.git
          git submodule update --init --remote --merge vendor/opentide vendor/specifications

      - name: Remove submodule SSH keys
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${KEY_DIR:-}" ] && [ -d "$KEY_DIR" ]; then
            rm -rf "$KEY_DIR"
          fi
          echo "GIT_SSH_COMMAND=" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Sync published docs
        run: pnpm sync:content

      - name: Commit documentation changes
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vendor/opentide vendor/specifications content/docs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Documentation already up to date."
            exit 0
          fi

          opentide_sha=$(git -C vendor/opentide rev-parse --short HEAD)
          specs_sha=$(git -C vendor/specifications rev-parse --short HEAD)
          pypi_version=unknown
          if node scripts/fetch-pypi-version.mjs; then
            pypi_version=$(python3 -c 'import json; print(json.load(open("lib/generated/pypi-release.json")).get("version") or "unknown")')
          fi

          git commit -m "$(cat <<EOF
          chore: sync documentation from upstream

          opentide@${opentide_sha} (PyPI ${pypi_version})
          specifications@${specs_sha}
          EOF
          )"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pypi_version=${pypi_version}" >> "$GITHUB_OUTPUT"

      - name: Verify the synced site builds
        if: steps.commit.outputs.changed == 'true'
        run: |
          pnpm lint
          pnpm types:check
          pnpm build
        env:
          SKIP_SYNC: '1'

      - name: Push to main and deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN cannot create pull requests unless the repository
          # setting "Allow GitHub Actions to create and approve pull requests"
          # is enabled. The commit is already linted/typechecked/built, so
          # land it on main and dispatch Pages (token pushes do not fire
          # on: push workflows).
          #
          # Concurrency serializes jobs, but a queued run still checks out
          # github.sha from when the event was accepted. If main moved,
          # replay the docs paths on top of origin/main instead of FF-only.
          SYNC_COMMIT=$(git rev-parse HEAD)
          git fetch origin main
          if git merge-base --is-ancestor origin/main "$SYNC_COMMIT"; then
            git push origin "$SYNC_COMMIT:refs/heads/main"
          else
            git checkout --force -B sync-push origin/main
            git checkout "$SYNC_COMMIT" -- vendor/opentide vendor/specifications content/docs
            git add vendor/opentide vendor/specifications content/docs
            if git diff --cached --quiet; then
              echo "main already has this documentation"
            else
              git commit -C "$SYNC_COMMIT"
              git push origin HEAD:refs/heads/main
            fi
          fi
          echo "Dispatching GitHub Pages deploy"
          gh workflow run deploy.yml --ref main
